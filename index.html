<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="SpendWise - An expense splitter and tracker is a specialized website for performing splitting of expenses among users, showing a list of expenses, balance summary with other users.">
    <meta name="keywords" content="SplitWise, Split expense, Expense tracker, SpendWise">
    <title>SettleUp: Split Expenses</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <header class="navbar">
        <h1>SettleUp</h1>
    </header>

    <main class="container">
        <section id="create-expense">
            <h2>Add an expense</h2>
            <form class="expense-form">

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="₹0.00" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g. Dinner" required minlength="3" maxlength="50">
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date">
                </div>

                <div class="form-group">
                    <label for="paidBy">Paid By</label>
                    <select id="paidBy">
                        <option value="">Select user</option>
                        <!-- Dynamic users -->
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Split With</label>
                    <div class="split-users">
                        <label><input type="checkbox" value="1"> Kushal</label>
                        <label><input type="checkbox" value="2"> User A</label>
                        <label><input type="checkbox" value="3"> User B</label>
                    </div>
                </div>

                <div class="form-actions full-width">
                    <button type="reset">Reset</button>
                    <button type="submit">Add Expense</button>
                </div>

            </form>
        </section>

        <section id="expense-list">
            <h2>My Expenses</h2>
            <div class="expense-items">
            </div>
        </section>

        <section id="summary-section">
            <h2>Summary</h2>

            <div class="summary-container">

                <div class="summary-card">
                    <h3>Overview</h3>
                    <p>Total Spent: <span class="total-spent">₹0</span></p>
                    <p>You Owe: <span class="you-owe">₹0</span></p>
                    <p>You Are Owed: <span class="you-owed">₹0</span></p>
                </div>

                <div class="summary-card">
                    <h3>Balances</h3>

                    <div class="balance-list">
                        <!-- Example -->
                        <div class="balance-item">
                            <span>A owes B</span>
                            <span class="amount negative">₹200</span>
                        </div>

                        <div class="balance-item">
                            <span>C owes You</span>
                            <span class="amount positive">₹150</span>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- Edit Expense Modal -->
    <div id="edit-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal">
            <h2>Edit Expense</h2>
            <form id="edit-expense-form" class="expense-form">

                <div class="form-group">
                    <label for="edit-amount">Amount</label>
                    <input type="number" id="edit-amount" placeholder="₹0.00" required>
                </div>

                <div class="form-group">
                    <label for="edit-description">Description</label>
                    <input type="text" id="edit-description" placeholder="e.g. Dinner" required minlength="3" maxlength="50">
                </div>

                <div class="form-group">
                    <label for="edit-date">Date</label>
                    <input type="date" id="edit-date">
                </div>

                <div class="form-group">
                    <label for="edit-paidBy">Paid By</label>
                    <select id="edit-paidBy">
                        <option value="">Select user</option>
                        <!-- Dynamic users -->
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Split With</label>
                    <div class="split-users">
                        <label><input type="checkbox" value="1"> Kushal</label>
                        <label><input type="checkbox" value="2"> User A</label>
                        <label><input type="checkbox" value="3"> User B</label>
                    </div>
                </div>

                <div class="form-actions full-width">
                    <button type="button" id="cancel-edit-btn">Cancel Edit</button>
                    <button type="submit">Update Expense</button>
                </div>

            </form>
        </div>
    </div>

    <div id="toast-container" aria-live="polite"></div>

    <script src="./src/main.js" type="module"></script>
</body>

</html>
