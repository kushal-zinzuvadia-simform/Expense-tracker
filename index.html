<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="SettleUp - An expense splitter and tracker for splitting expenses among users, showing a list of expenses, and balance summary.">
    <meta name="keywords" content="SplitWise, Split expense, Expense tracker, SettleUp">
    <title>SettleUp: Split Expenses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <header class="navbar">
        <div>
            <h1>SettleUp</h1>
            <p class="navbar-tagline">Split expenses, settle up easily</p>
        </div>

        <div class="user-dropdown">
            <div class="user-profile">
                <button type="button">
                    <img src="./src/assets/user.png" alt="User profile">
                    <span class="user-name"></span>
                </button>
            </div>

            <div class="user-menu">
                <div class="nav-user-header" id="user-list-toggle">
                    <span class="nav-user-label">Select active user</span>
                    <span class="nav-user-chevron" id="user-list-chevron">▾</span>
                </div>

                <div id="user-list-container" class="user-list-container user-list-collapsed">
                    <!-- Dynamic user rows -->
                </div>

                <hr class="partition">

                <div class="nav-user">
                    <input type="text" id="new-user-input" placeholder="Add a new user">

                    <button id="add-user-btn" class="user-btn">+</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="create-expense">
            <div class="section-header">
                <h2>My Expenses</h2>
                <button type="button" id="open-create-btn">+ New Expense</button>
            </div>

            <div class="empty-state" id="empty-state">
                <span class="empty-state-icon">📋</span>
                <p>No expenses yet</p>
                <p class="empty-state-hint">Click "New Expense" to get started</p>
            </div>

            <div class="expense-items">
                <!-- Dynamic expense cards -->
            </div>
        </section>

        <section id="summary-section">
            <h2>Summary</h2>

            <div class="summary-container">

                <div class="summary-card">
                    <h3>Overview</h3>
                    <p>Total Spent: <span class="total-paid">₹0</span></p>
                    <p>Total Splits: <span class="total-split">₹0</span></p>
                    <p>You Owe: <span class="you-owe amount negative">₹0</span></p>
                    <p>You are Owed: <span class="you-owed amount positive">₹0</span></p>
                </div>

                <div class="summary-card">
                    <h3>Balances</h3>

                    <div class="balance-list">
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- Create Expense Modal -->
    <div id="create-modal" class="modal-overlay" hidden>
        <div class="modal">
            <h2>Add Expense</h2>
            <form class="expense-form">

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="₹0.00" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g. Dinner" required minlength="3" maxlength="50">
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date">
                </div>

                <div class="form-group">
                    <label for="paidBy">Paid By</label>
                    <select id="paidBy">
                        <option value="">Select user</option>
                        <!-- Dynamic users -->
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Split With</label>
                    <div class="split-users">
                        <!-- Dynamic users -->
                    </div>
                </div>

                <div class="form-actions full-width">
                    <button type="button" id="cancel-create-btn">Cancel</button>
                    <button type="submit">Add Expense</button>
                </div>

            </form>
        </div>
    </div>

    <!-- Edit Expense Modal -->
    <div id="edit-modal" class="modal-overlay" hidden>
        <div class="modal">
            <h2>Edit Expense</h2>
            <form id="edit-expense-form" class="expense-form">

                <div class="form-group">
                    <label for="edit-amount">Amount</label>
                    <input type="number" id="edit-amount" placeholder="₹0.00" required>
                </div>

                <div class="form-group">
                    <label for="edit-description">Description</label>
                    <input type="text" id="edit-description" placeholder="e.g. Dinner" required minlength="3"
                        maxlength="50">
                </div>

                <div class="form-group">
                    <label for="edit-date">Date</label>
                    <input type="date" id="edit-date">
                </div>

                <div class="form-group">
                    <label for="edit-paidBy">Paid By</label>
                    <select id="edit-paidBy">
                        <option value="">Select user</option>
                        <!-- Dynamic users -->
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Split With</label>
                    <div class="split-users">
                        <!-- Dynamic users -->
                    </div>
                </div>

                <div class="form-actions full-width">
                    <button type="button" id="cancel-edit-btn">Cancel</button>
                    <button type="submit">Update Expense</button>
                </div>

            </form>
        </div>
    </div>

    <div id="toast-container" aria-live="polite"></div>

    <!-- Settle Up Modal -->
    <div id="settle-modal" class="modal-overlay" hidden>
        <div class="modal">
            <h2>Settle Up</h2>
            <div class="settle-direction" id="settle-direction"></div>
            <form id="settle-form" class="expense-form settle-form">
                <div class="form-group full-width">
                    <label for="settle-amount">Amount</label>
                    <input type="number" id="settle-amount" placeholder="₹0.00" min="0.01" step="0.01" required>
                </div>
                <div class="form-actions full-width">
                    <button type="button" id="cancel-settle-btn">Cancel</button>
                    <button type="submit" id="settle-submit-btn">Settle Up</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./src/main.js" type="module"></script>
</body>

</html>
